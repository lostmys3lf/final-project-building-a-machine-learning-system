# Konfigurasi Prometheus untuk memantau API model prediksi PM2.5
global:
  scrape_interval: 5s                      # Ambil metrik dari exporter setiap 5 detik

scrape_configs:
  - job_name: "ml_model_exporter"
    static_configs:
      - targets: ["127.0.0.1:8000"]        # Alamat prometheus_exporter.py
        labels:
          model: "pm25-lstm"                # Label penanda model, dipakai untuk memilih model di Grafana
