# Workflow preprocessing otomatis dataset Beijing Multi-Site Air Quality (kriteria 1 Advanced)
name: Preprocessing Dataset

on:
  push:
    branches: [main]
    paths:                                          # Jalan cuma kalau data raw, automate, atau workflow ini berubah
      - "beijing_air_quality_raw/**"
      - "preprocessing/automate_mardi-jefri.py"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:                                # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write                                   # Dibutuhkan supaya workflow bisa commit hasil preprocessing ke repo

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install library
        run: pip install pandas numpy scikit-learn joblib

      - name: Jalankan automate preprocessing
        run: python preprocessing/automate_mardi-jefri.py   # Hasilnya masuk ke preprocessing/beijing_air_quality_preprocessing

      - name: Commit hasil preprocessing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/beijing_air_quality_preprocessing
          git diff --staged --quiet || git commit -m "Update dataset hasil preprocessing"   # Commit cuma kalau ada perubahan
          git push
